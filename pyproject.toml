[project]
name = "automated-fpl-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gpytorch>=1.15.2",
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pydantic>=2.12.5",
    "pymongo>=4.17.0",
    "requests>=2.32.5",
    "torch>=2.13.0",
    "types-requests>=2.33.0.20260408",
]

[tool.setuptools]
packages = ["src"]
package-dir = {"src" = "./src"}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
