name: FPL Weekly Automation

on:
  schedule:
    - cron: "0 12 * * 5"  # Friday 12:00 UTC
  workflow_dispatch:
    inputs:
      fpl_user_id:
        description: "Your FPL user ID (leave blank to use the default from secrets)"
        required: false
        default: ""
      email_address:
        description: "Email address to send results to (leave blank to use the default from secrets)"
        required: false
        default: ""

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python with uv
        run: |
          uv python install 3.14

      - name: Install dependencies from pyproject.toml
        run: |
          uv sync
          uv pip install -e .

      - name: Run model
        env:
          FPL_USER_ID: ${{ github.event.inputs.fpl_user_id || secrets.FPL_USER_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p tmp
          uv run python bin/run.py > tmp/output.txt

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ADDRESS: ${{ github.event.inputs.email_address || secrets.EMAIL_ADDRESS }}
        run: |
          uv run python bin/email_findings.py tmp/output.txt
